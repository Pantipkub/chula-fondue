# Departments and routing rules; REST on 3001, called by the gateway and by Ticket Service.
apiVersion: v1
kind: Service
metadata:
  name: department-service
  labels:
    app: department-service
spec:
  selector:
    app: department-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
  labels:
    app: department-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: department-service
  template:
    metadata:
      labels:
        app: department-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: department-service
          image: chula-fondue-department-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: fondue-secrets
                optional: true
          env:
            - name: DEPARTMENT_PORT
              value: "3001"
            - name: DEPARTMENT_DATABASE_URL
              value: postgresql://fondue:fondue@postgres:5432/department
            # Before a department is deactivated: active staff (Auth) and open tickets (Ticket health port).
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3002
            - name: TICKET_SERVICE_HTTP_URL
              value: http://ticket-service:8081
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
