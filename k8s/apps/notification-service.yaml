# RabbitMQ consumer -> MongoDB (+ optional Gmail worker); health and the inbox API on 8082.
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  # No `replicas`: the HorizontalPodAutoscaler in ../autoscaling.yaml keeps 2-4 pods by CPU.
  # Competing consumers: RabbitMQ hands each message of the "notifications" queue to one replica.
  # Duplicates are ignored by eventId, and the Gmail worker claims each email with a lease.
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: notification-service
          image: chula-fondue-notification-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: fondue-secrets
                optional: true
          env:
            - name: HEALTH_PORT
              value: "8082"
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: MONGODB_URL
              value: mongodb://mongo:27017
            # Must match Auth Service: recovery links from any other origin are refused.
            - name: WEB_PUBLIC_URL
              value: http://localhost:8090
          ports:
            - name: http
              containerPort: 8082
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
