name: Complete platform
on: [push, pull_request]
jobs:
  verify:
    # MongoDB 8 currently rejects Linux >= 6.19; keep the CI host on a supported LTS.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      AUTO_ROUTING_ENABLED: 'true'
      AUTH_RATE_LIMIT: '300' # Higher only for automated fixture creation in the isolated demo.
    steps:
      - run: uname -a
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run setup:demo
      - run: docker compose --env-file .env.demo -p fondue-demo up -d --build --wait --wait-timeout 180
      - run: npm run test:coverage:integration
        env:
          ROUTING_TEST_DATABASE_URL: postgresql://fondue:fondue@127.0.0.1:5435/ticket
      - run: npm run test:e2e
      - run: node --env-file-if-exists=.env.demo tests/platform-e2e.mjs
      - run: npm run test:recovery
      - run: npm run seed:demo
      - run: npm run test:routing
      - run: npm run test:routing:recovery
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: npm run test:ui:sonar
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: npm run test:ui:queue
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: npm run test:ui:live
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: node --env-file-if-exists=.env.demo tests/platform-ui.mjs
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: node tests/ui-auth-tabs.mjs
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - run: node --env-file-if-exists=.env.demo tests/routing-ui.mjs
        env:
          WEB_URL: http://127.0.0.1:8080
          BROWSER_CHANNEL: chromium
      - if: always()
        run: mkdir -p test-results && docker compose --env-file .env.demo -p fondue-demo logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            coverage/
