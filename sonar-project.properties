sonar.projectKey=chula-fondue
sonar.projectName=Chula Fondue
sonar.sourceEncoding=UTF-8

# โค้ดหลัก: frontend และ backend ทั้งหมด
sonar.sources=frontend/src,services

# โค้ดทดสอบ
sonar.tests=tests

# ข้าม dependencies, ไฟล์ build และไฟล์อัปโหลด
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/uploads/**

# Generated by npm run test:coverage; paths inside LCOV are relative to the repository.
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info
