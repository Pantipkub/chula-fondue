server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 30m; # up to 5 photos of 5 MB each

  # Docker's embedded DNS. Using a variable in proxy_pass makes nginx look the name up again
  # (every 5 s) instead of once at startup, so a re-created gateway with a new IP is still found (ADR-009).
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $gateway http://api-gateway:3000;

  # Same paths as the Vite dev proxy: the browser never calls the gateway directly, so no CORS is needed.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_read_timeout 30s;
  }
  location /uploads/ {
    proxy_pass $gateway;
  }
  location = /health {
    default_type text/plain;
    return 200 'ok';
  }
  # Client-side routes (/admin, /tickets/:id, ...) all load index.html.
  location / {
    try_files $uri /index.html;
  }
}
